<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Night Money — Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body data-page="settings">

    <div id="app"></div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

    <script>
        (function () {

            NightMoney.renderAppShell(`

        ${NightMoney.getPageTitle(
                "Settings",
                "Manage your account, business and system preferences."
            )}

        <div class="settings-layout">

            <aside class="settings-nav">

                <button class="active">
                    Account
                </button>

                <button>
                    Business
                </button>

                <button>
                    Appearance
                </button>

                <button>
                    System
                </button>

            </aside>

            <main>

                <section class="settings-section">

                    <h3>Account</h3>

                    <p>
                        Manage your Night Money account information.
                    </p>

                    <div class="form-grid">

                        <div class="form-group">

                            <label>Name</label>

                            <input
                                value="Alex Morgan"
                            >

                        </div>

                        <div class="form-group">

                            <label>Email</label>

                            <input
                                type="email"
                                value="admin@nightmotors.com"
                            >

                        </div>

                    </div>

                    <div class="form-actions">

                        <button
                            class="btn btn-primary"
                            id="saveAccount"
                        >
                            Save Changes
                        </button>

                    </div>

                </section>

                <section class="settings-section">

                    <h3>Business</h3>

                    <p>
                        Business and financial configuration.
                    </p>

                    <div class="form-grid">

                        <div class="form-group">

                            <label>Business Name</label>

                            <input
                                value="Night Motors"
                            >

                        </div>

                        <div class="form-group">

                            <label>Currency</label>

                            <select>

                                <option selected>
                                    Toman / تومان / ₮
                                </option>

                                <option>
                                    USD
                                </option>

                                <option>
                                    EUR
                                </option>

                            </select>

                        </div>

                        <div class="form-group full">

                            <label>Business Information</label>

                            <textarea rows="4">Night Motors — Automotive Products & Services</textarea>

                        </div>

                    </div>

                </section>

                <section class="settings-section">

                    <h3>Appearance</h3>

                    <p>
                        Customize how Night Money looks and behaves.
                    </p>

                    <div class="setting-row">

                        <div class="setting-label">

                            <strong>
                                Dark Mode
                            </strong>

                            <span>
                                Use the dark Night Money interface.
                            </span>

                        </div>

                        <label class="switch">

                            <input
                                type="checkbox"
                                id="settingsTheme"
                            >

                            <span class="slider"></span>

                        </label>

                    </div>

                    <div class="setting-row">

                        <div class="setting-label">

                            <strong>
                                Language
                            </strong>

                            <span>
                                English / فارسی
                            </span>

                        </div>

                        <select
                            id="settingsLanguage"
                            style="width:120px"
                        >

                            <option value="en">
                                English
                            </option>

                            <option value="fa">
                                فارسی
                            </option>

                        </select>

                    </div>

                </section>

                <section class="settings-section">

                    <h3>System</h3>

                    <p>
                        System-level options and data management.
                    </p>

                    <div class="setting-row">

                        <div class="setting-label">

                            <strong>
                                Notifications
                            </strong>

                            <span>
                                Receive business activity notifications.
                            </span>

                        </div>

                        <label class="switch">

                            <input
                                type="checkbox"
                                checked
                            >

                            <span class="slider"></span>

                        </label>

                    </div>

                    <div class="setting-row">

                        <div class="setting-label">

                            <strong>
                                Backup
                            </strong>

                            <span>
                                Prepare business data for backup.
                            </span>

                        </div>

                        <button
                            class="btn btn-secondary"
                            id="backupButton"
                        >
                            Create Backup
                        </button>

                    </div>

                </section>

            </main>

        </div>

    `);

            const themeCheckbox =
                document.getElementById(
                    "settingsTheme"
                );

            themeCheckbox.checked =
                localStorage.getItem(
                    "nightMoneyTheme"
                ) !== "light";

            themeCheckbox.addEventListener(
                "change",
                () => {

                    localStorage.setItem(
                        "nightMoneyTheme",
                        themeCheckbox.checked
                            ? "dark"
                            : "light"
                    );

                    document.documentElement.dataset.theme =
                        themeCheckbox.checked
                            ? "dark"
                            : "light";

                    NightMoney.showToast(
                        "Appearance updated."
                    );
                }
            );

            const languageSelect =
                document.getElementById(
                    "settingsLanguage"
                );

            languageSelect.value =
                localStorage.getItem(
                    "nightMoneyLanguage"
                ) || "en";

            languageSelect.addEventListener(
                "change",
                () => {

                    localStorage.setItem(
                        "nightMoneyLanguage",
                        languageSelect.value
                    );

                    location.reload();
                }
            );

            document
                .getElementById("saveAccount")
                ?.addEventListener(
                    "click",
                    () => {

                        NightMoney.showToast(
                            "Account information saved."
                        );
                    }
                );

            document
                .getElementById("backupButton")
                ?.addEventListener(
                    "click",
                    () => {

                        const backup = {
                            products: NightMoneyData.products,
                            transactions: NightMoneyData.transactions,
                            sales: NightMoneyData.sales,
                            purchases: NightMoneyData.purchases,
                            createdAt: new Date().toISOString()
                        };

                        const blob =
                            new Blob(
                                [
                                    JSON.stringify(
                                        backup,
                                        null,
                                        2
                                    )
                                ],
                                {
                                    type:
                                        "application/json"
                                }
                            );

                        const url =
                            URL.createObjectURL(blob);

                        const link =
                            document.createElement("a");

                        link.href = url;
                        link.download =
                            "night-money-backup.json";

                        link.click();

                        URL.revokeObjectURL(url);

                        NightMoney.showToast(
                            "Backup file created."
                        );
                    }
                );

        })();
    </script>

</body>

</html>
