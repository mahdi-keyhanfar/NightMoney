<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Night Money | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <!-- Decorative Background -->
        <div class="background-decoration decoration-one"></div>
        <div class="background-decoration decoration-two"></div>
        <div class="background-grid"></div>

        <!-- Theme Toggle -->
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <span class="theme-icon" id="themeIcon">☾</span>
        </button>

        <!-- Login Card -->
        <section class="login-card">

            <!-- Brand -->
            <div class="brand">

                <div class="brand-logo">
                    <span>N</span>
                </div>

                <div class="brand-name">
                    <h1>Night Money</h1>
                    <p data-i18n="brandSubtitle">
                        مدیریت هوشمند فروش
                    </p>
                </div>

            </div>


            <!-- Login Header -->
            <div class="login-header">

                <h2 data-i18n="welcome">
                    خوش آمدید
                </h2>

                <p data-i18n="loginDescription">
                    برای ورود به پنل مدیریت، اطلاعات خود را وارد کنید.
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm" class="login-form" novalidate>

                <!-- Username -->
                <div class="input-group">

                    <label for="username" data-i18n="username">
                        نام کاربری
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M20 21a8 8 0 0 0-16 0" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>

                        <input type="text" id="username" name="username" autocomplete="username"
                            placeholder="نام کاربری خود را وارد کنید" data-i18n-placeholder="usernamePlaceholder">

                    </div>

                    <span class="input-error" id="usernameError"></span>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password" data-i18n="password">
                        رمز عبور
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <rect x="4" y="10" width="16" height="11" rx="2" />
                                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                            </svg>
                        </span>

                        <input type="password" id="password" name="password" autocomplete="current-password"
                            placeholder="رمز عبور خود را وارد کنید" data-i18n-placeholder="passwordPlaceholder">

                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="2.5" />
                            </svg>
                        </button>

                    </div>

                    <span class="input-error" id="passwordError"></span>

                </div>


                <!-- Remember Me -->
                <div class="form-options">

                    <label class="remember-me">

                        <input type="checkbox" id="rememberMe" name="rememberMe">

                        <span class="custom-checkbox"></span>

                        <span data-i18n="rememberMe">
                            مرا به خاطر بسپار
                        </span>

                    </label>

                </div>


                <!-- Login Button -->
                <button type="submit" class="login-button" id="loginButton">

                    <span class="button-text" data-i18n="login">
                        ورود به پنل
                    </span>

                    <span class="button-loader"></span>

                    <svg class="button-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14" />
                        <path d="m13 6 6 6-6 6" />
                    </svg>

                </button>

                <!-- Login Message -->
                <div class="login-message" id="loginMessage" role="alert"></div>

            </form>


            <!-- Footer -->
            <div class="login-footer">

                <div class="footer-line"></div>

                <div class="footer-content">

                    <span data-i18n="secureAccess">
                        دسترسی امن و اختصاصی
                    </span>

                    <span class="footer-dot">•</span>

                    <button type="button" id="languageToggle" class="language-toggle">
                        EN
                    </button>

                </div>

            </div>

        </section>


        <!-- Bottom Brand -->
        <div class="page-footer">
            <span>Night Money</span>
            <span>•</span>
            <span data-i18n="allRights">
                تمامی حقوق محفوظ است
            </span>
        </div>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
